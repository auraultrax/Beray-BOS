<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Mail · Beray</title><link rel="stylesheet" href="app.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.0"></script><script src="supabase-config.js"></script></head><body><main class="app-shell"><header class="app-top"><button class="app-back" onclick="parent.postMessage({type:'BERAY_GO_HOME'},location.origin)">‹</button><div><h1 class="app-title">Mail</h1><div class="app-sub">Beray içi mesajlaşma</div></div><span class="pill" id="mailUser">Bağlanıyor…</span></header>
<div class="row"><button class="btn" id="inboxTab">Gelen kutusu</button><button class="btn secondary" id="sentTab">Gönderilen</button><button class="btn secondary" id="composeTab">Yeni ileti</button></div>
<section id="messageList" class="card"><p class="muted">İletiler yükleniyor…</p></section>
<section id="compose" class="card" hidden><h2>Yeni ileti</h2><label class="muted">Alıcının Beray e-posta adresi</label><input id="to" type="email" placeholder="kisi@beray" required><label class="muted">Konu</label><input id="subject" placeholder="Konu"><label class="muted">Mesaj</label><textarea id="body" placeholder="Mesajını yaz…"></textarea><button class="btn" id="send">Gönder</button><p class="muted" style="font-size:12px">Bu sürüm Beray kullanıcıları arasında ileti gönderir; harici e-posta servislerine henüz bağlı değildir.</p></section>
<div id="detail" class="card" hidden></div></main><div class="toast" id="toast"></div>
<script>
const sb=window.beraySupabase,$=s=>document.querySelector(s),toast=m=>{const e=$('#toast');e.textContent=m;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),2400)};let user=null,mode='inbox';
async function init(){const {data,error}=await sb.auth.getUser();if(error||!data.user){$('#mailUser').textContent='Giriş gerekli';$('#messageList').innerHTML='<p>Mail kullanmak için önce Beray hesabıyla giriş yapmalısın.</p><button class="btn" onclick="parent.postMessage({type:\'BERAY_GO_HOME\'},location.origin)">Ana ekrana dön</button>';return;}user=data.user;$('#mailUser').textContent=data.user.email||'Beray';load();}
async function load(){const q=sb.from('beray_mail').select('*').order('created_at',{ascending:false}).limit(60);const {data,error}=mode==='inbox'?await q.ilike('recipient_email',user.email):await q.eq('sender_id',user.id);if(error){$('#messageList').textContent=error.message;return;}$('#messageList').innerHTML=data.length?'':'<p class="muted">Henüz ileti yok.</p>';data.forEach(m=>{const el=document.createElement('div');el.className='list-item';const title=document.createElement('strong');title.textContent=m.subject||'(Konu yok)';const sub=document.createElement('p');sub.className='muted';sub.textContent=(mode==='inbox'?'Gönderen: '+m.sender_email:'Alıcı: '+m.recipient_email)+' · '+new Date(m.created_at).toLocaleString('tr-TR');const open=document.createElement('button');open.className='btn secondary';open.textContent='Aç';open.onclick=async()=>{const d=$('#detail');d.hidden=false;d.innerHTML='';const h=document.createElement('h3');h.textContent=m.subject;const p=document.createElement('p');p.className='muted';p.textContent=m.sender_email+' → '+m.recipient_email;const body=document.createElement('p');body.style.whiteSpace='pre-wrap';body.textContent=m.body;d.append(h,p,body);if(mode==='inbox'&&!m.is_read)await sb.from('beray_mail').update({is_read:true}).eq('id',m.id);};el.append(title,sub,open);$('#messageList').appendChild(el);});}
$('#inboxTab').onclick=()=>{mode='inbox';$('#compose').hidden=true;$('#detail').hidden=true;load()};$('#sentTab').onclick=()=>{mode='sent';$('#compose').hidden=true;$('#detail').hidden=true;load()};$('#composeTab').onclick=()=>{$('#compose').hidden=false;$('#detail').hidden=true};
$('#send').onclick=async()=>{const recipient=$('#to').value.trim(),subject=$('#subject').value.trim(),body=$('#body').value.trim();if(!recipient||!body){toast('Alıcı ve mesaj zorunludur.');return;}const {error}=await sb.from('beray_mail').insert({sender_id:user.id,sender_email:user.email,recipient_email:recipient,subject,body});if(error){toast('Gönderilemedi: '+error.message);return;}toast('Beray iletisi gönderildi.');$('#to').value=$('#subject').value=$('#body').value='';$('#compose').hidden=true;mode='sent';load();};init();
</script></body></html>
