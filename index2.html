<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Telefon · Beray</title><link rel="stylesheet" href="app.css"></head><body><main class="app-shell"><header class="app-top"><button class="app-back" onclick="parent.postMessage({type:'BERAY_GO_HOME'},location.origin)">‹</button><div><h1 class="app-title">Telefon</h1><div class="app-sub">Kişiler · Tuş takımı · Son kayıtlar</div></div></header>
<div class="row"><button class="btn" id="dialTab">Tuş takımı</button><button class="btn secondary" id="contactsTab">Kişiler</button><button class="btn secondary" id="recentTab">Son aramalar</button></div>
<section id="dial" class="card"><div id="number" style="font:600 28px 'Space Grotesk';text-align:center;min-height:42px;letter-spacing:2px"></div><div class="keypad" id="keys"></div><div class="row"><button class="btn secondary" id="erase">Sil</button><button class="btn" id="call" style="flex:1">Ara</button></div><p class="muted" style="font-size:12px">Gerçek GSM araması için Beray OS modem/telefon sürücüsü gereklidir.</p></section>
<section id="contacts" class="card" hidden><h2>Kişiler</h2><input id="personName" placeholder="Ad Soyad"><input id="personPhone" placeholder="Telefon numarası"><button class="btn" id="addPerson">Kişi ekle</button><div id="contactList"></div></section>
<section id="recent" class="card" hidden><h2>Son aramalar</h2><div id="recentList"></div></section></main><div class="toast" id="toast"></div>
<script>
const $=s=>document.querySelector(s),toast=m=>{const t=$('#toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200)};let number='';const get=k=>JSON.parse(localStorage.getItem('beray-'+k)||'[]'),put=(k,v)=>localStorage.setItem('beray-'+k,JSON.stringify(v));
function view(id){['dial','contacts','recent'].forEach(x=>$('#'+x).hidden=x!==id);if(id==='contacts')renderContacts();if(id==='recent')renderRecent();}
$('#dialTab').onclick=()=>view('dial');$('#contactsTab').onclick=()=>view('contacts');$('#recentTab').onclick=()=>view('recent');
'123456789*0#'.split('').forEach(n=>{const b=document.createElement('button');b.textContent=n;b.onclick=()=>{number+=n;$('#number').textContent=number};$('#keys').appendChild(b)});
$('#erase').onclick=()=>{number=number.slice(0,-1);$('#number').textContent=number};
$('#call').onclick=async()=>{if(!number){toast('Önce numara gir.');return;}const row={number,at:new Date().toISOString()};const a=get('calls');a.unshift(row);put('calls',a.slice(0,100));if(window.berayHardware?.call){try{await window.berayHardware.call(number);toast('Arama başlatıldı.')}catch(e){toast('Arama başarısız: '+e.message)}}else toast('Arama kaydı oluşturuldu. Gerçek arama için Beray modem sürücüsü gerekli.');number='';$('#number').textContent='';};
$('#addPerson').onclick=()=>{const name=$('#personName').value.trim(),phone=$('#personPhone').value.trim();if(!name||!phone){toast('Ad ve telefon gerekli.');return;}const a=get('contacts');a.push({name,phone});put('contacts',a);$('#personName').value=$('#personPhone').value='';renderContacts();};
function renderContacts(){const host=$('#contactList');host.innerHTML='';get('contacts').forEach(p=>{const d=document.createElement('div');d.className='list-item';const b=document.createElement('button');b.className='btn secondary';b.textContent='Ara';b.onclick=()=>{number=p.phone;$('#number').textContent=number;view('dial')};const t=document.createElement('span');t.textContent=p.name+' · '+p.phone;d.append(t,b);host.appendChild(d)});}
function renderRecent(){const host=$('#recentList');host.innerHTML='';get('calls').forEach(c=>{const d=document.createElement('div');d.className='list-item';d.textContent=c.number+' · '+new Date(c.at).toLocaleString('tr-TR');host.appendChild(d)});if(!host.children.length)host.textContent='Arama kaydı yok.';}
</script></body></html>
