<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Beray AI</title><link rel="stylesheet" href="app.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.0"></script><script src="supabase-config.js"></script></head><body><main class="app-shell"><header class="app-top"><button class="app-back" onclick="parent.postMessage({type:'BERAY_GO_HOME'},location.origin)">‹</button><div><h1 class="app-title">Beray Intelligence</h1><div class="app-sub">Kişisel yapay zekâ</div></div></header><section class="card"><div class="eyebrow" style="color:var(--cyan);font-size:11px;letter-spacing:2px">BERAY AI CORE</div><h2>Nasıl yardımcı olayım?</h2><p class="muted">Sorularını Beray'ın sunucu tarafındaki yapay zekâ motoruna gönder. Model anahtarı bu ekrana aktarılmaz.</p></section><section class="card"><div id="chat"><div class="result">Merhaba, ben Beray Intelligence. Nasıl yardımcı olabilirim?</div></div><textarea id="prompt" placeholder="Beray'a bir şey sor…"></textarea><button class="btn" id="ask">Gönder</button></section></main><div class="toast" id="toast"></div>
<script>
const $=s=>document.querySelector(s),history=[];$('#ask').onclick=async()=>{const prompt=$('#prompt').value.trim();if(!prompt)return;const host=$('#chat'),button=$('#ask');const q=document.createElement('div');q.className='card';q.textContent='Sen: '+prompt;host.appendChild(q);history.push({role:'user',content:prompt});$('#prompt').value='';button.disabled=true;button.textContent='Beray düşünüyor…';try{const {data,error}=await window.beraySupabase.functions.invoke('beray-ai',{body:{messages:history}});if(error)throw error;if(!data?.answer)throw new Error(data?.error||'AI yanıtı boş döndü.');const a=document.createElement('div');a.className='result';a.textContent=data.answer;host.appendChild(a);history.push({role:'assistant',content:data.answer});}catch(e){const a=document.createElement('div');a.className='result';a.textContent='Beray AI yanıt veremedi: '+(e.message||'Bağlantı hatası');host.appendChild(a);}finally{button.disabled=false;button.textContent='Gönder';}};
</script></body></html>
