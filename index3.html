<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Beray AI</title><link rel="stylesheet" href="app.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.0"></script><script src="supabase-config.js"></script></head><body><main class="app-shell"><header class="app-top"><button class="app-back" onclick="parent.postMessage({type:'BERAY_GO_HOME'},location.origin)">‹</button><div><h1 class="app-title">Beray Intelligence</h1><div class="app-sub">Kişisel yapay zekâ</div></div></header><section class="card"><div class="eyebrow" style="color:var(--cyan);font-size:11px;letter-spacing:2px">BERAY AI CORE</div><h2>Nasıl yardımcı olayım?</h2><p class="muted">Bu sohbet arayüzü hazır. Güvenli yanıt üretimi için sunucu tarafı AI motoru ve model API anahtarı bağlanması gerekiyor.</p></section><section class="card"><div id="chat"><div class="result">Beray AI motoru henüz bağlanmadı. API anahtarı tarayıcıya koyulmayacak; sunucu tarafında saklanacak.</div></div><textarea id="prompt" placeholder="Beray'a bir şey sor…"></textarea><button class="btn" id="ask">Gönder</button></section></main><div class="toast" id="toast"></div>
<script>
const $=s=>document.querySelector(s);$('#ask').onclick=async()=>{const prompt=$('#prompt').value.trim();if(!prompt)return;const host=$('#chat');const q=document.createElement('div');q.className='card';q.textContent='Sen: '+prompt;host.appendChild(q);$('#prompt').value='';try{const {data,error}=await window.beraySupabase.functions.invoke('beray-ai',{body:{message:prompt}});if(error)throw error;const a=document.createElement('div');a.className='result';a.textContent=data?.reply||'AI yanıtı boş döndü.';host.appendChild(a);}catch(e){const a=document.createElement('div');a.className='result';a.textContent='Beray AI sunucusu henüz kurulmadı veya yanıt vermedi. Sunucu fonksiyonu ve AI sağlayıcı anahtarı eklenmeli. ('+e.message+')';host.appendChild(a);}};
</script></body></html>
